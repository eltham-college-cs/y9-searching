<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Y9 Searching · Workbooks</title>
<style>
:root{--navy9:#0A1B2E;--navy7:#163351;--navy5:#2A5A8C;--navy1:#D7E3EF;--gold5:#C89B3C;--gold3:#E3C783;--paper:#F7F8FA;--ink:#1A1D21;--muted:#555D68;--line:#E3E8EF}
*{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2{font-family:Georgia,serif;font-weight:400;margin:0}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}
header{background:var(--navy9);color:#fff;padding:26px 0 30px;margin-bottom:24px}
.kicker{font-size:13px;font-weight:700;letter-spacing:.1em;color:var(--gold3);text-transform:uppercase}
header h1{font-size:clamp(30px,5vw,44px);margin:6px 0 8px}
header p{color:var(--navy1);margin:0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;padding-bottom:60px}
.card{display:block;background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;color:inherit;text-decoration:none}
a.card:hover,a.card:focus-visible{border-color:var(--navy5);outline:none;box-shadow:0 0 0 3px var(--gold3)}
.card .n{font-size:12px;font-weight:700;letter-spacing:.08em;color:#8A6520}
.card h2{font-size:24px;color:var(--navy9);margin:4px 0 6px}
.card p{margin:0;color:var(--muted);font-size:15px}
.card.soon{opacity:.55}
</style>
</head>
<body>
<header><div class="wrap"><div class="kicker">Year 9 · Computer Science · C#</div><h1>Searching</h1><p>Interactive workbooks. Your answers save in this browser on this device.</p></div></header>
<main class="wrap"><div class="cards">
<a class="card" href="lesson-1/"><div class="n">LESSON 1</div><h2>Linear search</h2><p>Task 4: build a linear search line by line, then two compulsory trace tables.</p></a>
<div class="card soon"><div class="n">LESSON 2</div><h2>Binary search</h2><p>Coming soon.</p></div>
</div></main>
</body>
</html>
